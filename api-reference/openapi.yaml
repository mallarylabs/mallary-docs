          properties:
            platforms:
              type: array
              items:
                $ref: "#/components/schemas/ConnectedPlatformItem"
            profile_id:
              type: string
              pattern: "^[A-Za-z0-9]{6,32}$"
              nullable: true
            default_profile_id:
