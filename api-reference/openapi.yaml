          $ref: "#/components/schemas/ProfileId"
          description: Connection profile to disconnect from. Omit to use the default profile.

    PlatformProfile:
      type: object
      properties:
        id:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        scope:
