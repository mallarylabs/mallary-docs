          description: Enables AI auto-replies for this profile when the plan and profile fields allow it.
        brand_profile:
          type: string
        business_name:
          type: string
        business_description:
          type: string
        website_url:
          type: string
        services:
          type: string
        features:
          type: string
        contact_info:
          type: string
        pricing:
          type: string
        faq:
          type: string

