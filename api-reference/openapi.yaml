              pattern: "^[A-Za-z0-9]{6,32}$"
              nullable: true
            auto_reply_enabled:
              type: boolean
            capabilities:
              $ref: "#/components/schemas/Capabilities"
            auto_reply_profile:
              $ref: "#/components/schemas/AutoReplyProfileState"
            warnings:
              type: array
              items:
                $ref: "#/components/schemas/AutoReplyWarning"
            brand_profile:
              type: string
            business_name:
              type: string
            business_description:
              type: string
            website_url:
              type: string
            services:
              type: string
            features:
              type: string
            contact_info:
              type: string
            pricing:
              type: string
            faq:
              type: string

    ConnectedPlatformItem:
